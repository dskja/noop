# NOOP Beta — separate CI for the Beta iOS app.
#
# Two jobs:
#   1. compile  — compile-verification on every PR/push touching Beta/ or shared code.
#                 Unsigned, no secrets, just checks it builds.
#   2. release  — builds an unsigned .ipa artefact on tags (v*) or manual dispatch.
#                 The IPA is anonymized and uploaded as a workflow artefact + GitHub release asset.
#
# "Getrennt" — this workflow is completely independent of the main app-build.yml.
name: Beta build (iOS)

on:
  pull_request:
    branches: [main]
    paths:
      - 'Beta/**'
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/beta-build.yml'
  push:
    branches: [main]
    paths:
      - 'Beta/**'
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/beta-build.yml'
    tags:
      - "beta-v*"
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Build IPA release artefact (not just compile check)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile NOOPBeta
    runs-on: macos-15
    if: github.event_name == 'pull_request' || github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build NOOPBeta
        run: >-
          xcodebuild -scheme NOOPBeta -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

  release:
    name: Build Beta IPA artefact
    runs-on: macos-15
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.make_release) ||
      startsWith(github.ref, 'refs/tags/beta-v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/beta-v* ]]; then
            version="${GITHUB_REF_NAME#beta-v}"
          else
            version="$(sed -n 's/.*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}.*/\1/p' project.yml | head -n 1)"
            test -n "$version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building NOOPBeta IPA for v$version"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Beta IPA
        run: |
          set -euo pipefail
          rm -rf build/beta-dd build/beta-stage
          xcodebuild -scheme NOOPBeta -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/beta-dd \
            CODE_SIGNING_ALLOWED=NO build
          app="build/beta-dd/Build/Products/Release-iphoneos/NOOPBeta.app"
          test -d "$app"
          Tools/anonymize-ios-app.sh "$app"
          stage="build/beta-stage"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          rm -rf "$stage"
          mkdir -p "$stage/Payload"
          ditto "$app" "$stage/Payload/NOOPBeta.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$stage/Payload" "$GITHUB_WORKSPACE/dist/NOOPBeta-v${VERSION}-ios.ipa"
          ls -lh "$GITHUB_WORKSPACE/dist/NOOPBeta-v${VERSION}-ios.ipa"

      - name: Upload Beta IPA artefact
        uses: actions/upload-artifact@v4
        with:
          name: noop-beta-ipa
          path: dist/NOOPBeta-v*-ios.ipa
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/beta-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "NOOP Beta ${tag}" \
              --notes "Unsigned NOOP Beta IPA for sideloading (AltStore / SideStore / Sideloadly)." --latest=false
          fi
